services:
  ai_ml_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learnpath_ai_ml
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - APP_NAME=learnpath-ai-ml
      - APP_ENV=production
      - DEBUG=false
      - AI_SERVICE_API_KEY=ai-service-internal-key
      - AI_MOCK_MODE=false
      - LLM_PROVIDER=local_transformers
      - LLM_MODEL_NAME=Qwen/Qwen2.5-7B-Instruct
      - LLM_LOAD_IN_4BIT=true
      - EMBEDDING_PROVIDER=bge_m3
      - EMBEDDING_MODEL_NAME=BAAI/bge-m3
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=learnpath_resources
      - ENABLE_RERANKING=false
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: learnpath_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_storage:
